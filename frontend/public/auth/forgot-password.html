<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - SkillCert</title>
    <link rel="stylesheet" href="/styles/main.css">
</head>
<body class="bg-gray-50">
    <main class="min-h-screen flex items-center justify-center p-4">
        <section class="card max-w-md w-full">
            <div class="card-header">
                <h1 class="card-title">Password Recovery</h1>
                <p class="card-subtitle">Enter your email to start recovery.</p>
            </div>
            <form onsubmit="handleForgotPassword(event)">
                <div class="form-group">
                    <label>Email</label>
                    <input name="email" type="email" required>
                </div>
                <p id="auth-error" class="text-sm text-gray-600 mb-4"></p>
                <button class="btn btn-primary w-full" type="submit">Send Recovery Link</button>
            </form>
            <p class="text-sm mt-4">
                <a class="text-indigo-600 hover:underline" href="/auth/login.html">Back to login</a>
            </p>
        </section>
    </main>
    <script src="/scripts/api.js"></script>
    <script src="/scripts/auth.js"></script>
</body>
</html>
