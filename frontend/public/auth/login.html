<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SkillCert</title>
    <link rel="stylesheet" href="/styles/main.css">
</head>
<body class="bg-gray-50">
    <main class="min-h-screen flex items-center justify-center p-4">
        <section class="card max-w-md w-full">
            <div class="card-header">
                <h1 class="card-title">SkillCert Login</h1>
                <p class="card-subtitle">Access your learner or institution dashboard.</p>
            </div>
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Email</label>
                    <input name="email" type="email" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input name="password" type="password" required>
                </div>
                <p id="auth-error" class="text-sm text-red-600 mb-4"></p>
                <button class="btn btn-primary w-full" type="submit">Login</button>
            </form>
            <p class="text-sm text-gray-600 mt-4">
                No account? <a class="text-indigo-600 hover:underline" href="/auth/register.html">Register</a>
            </p>
            <p class="text-sm mt-1">
                <a class="text-indigo-600 hover:underline" href="/auth/forgot-password.html">Forgot password?</a>
            </p>
        </section>
    </main>
    <script src="/scripts/api.js"></script>
    <script src="/scripts/auth.js"></script>
</body>
</html>
