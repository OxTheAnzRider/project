<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - SkillCert</title>
    <link rel="stylesheet" href="/styles/main.css">
</head>
<body class="bg-gray-50">
    <main class="min-h-screen flex items-center justify-center p-4">
        <section class="card max-w-md w-full">
            <div class="card-header">
                <h1 class="card-title">Create Account</h1>
                <p class="card-subtitle">Register before viewing courses or assessments.</p>
            </div>
            <form onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label>Role</label>
                    <select name="role">
                        <option value="LEARNER">Learner</option>
                        <option value="INSTITUTION">Institution</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Name / Institution Name</label>
                    <input name="full_name" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input name="email" type="email" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input name="password" type="password" minlength="8" required>
                </div>
                <div class="form-group">
                    <label>Wallet Address</label>
                    <input name="wallet" placeholder="0x..." required>
                </div>
                <div class="form-group">
                    <label>Programme</label>
                    <input name="programme" placeholder="General">
                </div>
                <p id="auth-error" class="text-sm text-red-600 mb-4"></p>
                <button class="btn btn-primary w-full" type="submit">Register</button>
            </form>
            <p class="text-sm text-gray-600 mt-4">
                Already registered? <a class="text-indigo-600 hover:underline" href="/auth/login.html">Login</a>
            </p>
        </section>
    </main>
    <script src="/scripts/api.js"></script>
    <script src="/scripts/auth.js"></script>
</body>
</html>
